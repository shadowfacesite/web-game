name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «запустить вручную» на вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация. Если запушил дважды подряд,
# первая сборка отменяется, выкладывается вторая.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Без npm ci: файла package-lock.json в репозитории может ещё не быть.
      - run: npm install

      # Планировка проверяется до сборки. Сломанная карта валит сборку,
      # и в игру не попадает.
      - name: Проверить планировку
        run: node tools/validate.mjs

      - name: Убедиться, что валидатор ловит ошибку
        run: node tools/validate.mjs --selftest

      - name: Карта проходимости в лог
        run: node tools/validate.mjs --map 7

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
