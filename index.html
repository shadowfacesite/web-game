<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ЗАТОН</title>
  </head>
  <body>
    <canvas id="view"></canvas>

    <!-- Отладочная строка. Живёт до Э10, потом убирается целиком. -->
    <pre id="hud"></pre>

    <!-- Захват мыши требует жеста пользователя. Без этого экрана его негде взять. -->
    <div id="veil">
      <p class="veil-title">Э0 — каркас</p>
      <p class="veil-hint">
        Щёлкни по экрану, чтобы захватить мышь<br />
        WASD — идти &nbsp;·&nbsp; Shift — бежать &nbsp;·&nbsp; Esc — отпустить мышь<br />
        <b>F9 — собрать отчёт о железе и скопировать в буфер</b>
      </p>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
