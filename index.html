<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ЗАТОН · кит шаблонов</title>
  </head>
  <body>
    <!-- Верхняя панель наполняется из ui.ts: гизмо, привязки, режимы карты. -->
    <header id="toolbar"></header>

    <main id="stage">
      <canvas id="view"></canvas>

      <!-- Подписи — обычный DOM поверх холста. Так они читаются с любого
           расстояния и рисуются тем же шрифтом, что и весь интерфейс. -->
      <div id="labels"></div>

      <div id="hud">
        <span id="fps">— FPS</span>
        <span id="count">предметов: 0</span>
        <span class="hud-hint">колесо — приблизить · ЛКМ — вращать вид · ПКМ — сдвинуть</span>
      </div>
    </main>

    <aside id="catalog" class="panel">
      <h2 class="panel-title">Каталог</h2>
    </aside>

    <aside id="inspector" class="panel">
      <h2 class="panel-title">Предмет</h2>
    </aside>

    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
